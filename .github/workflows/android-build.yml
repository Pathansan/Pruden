name: Android Build (PowerVR Pixel 10)

on:
  push:
    branches:
      - powervr-pixel10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK, NDK, and CMake
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;3.31.5"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Android APK (mainlineRelWithDebInfo)
        working-directory: src/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleMainlineRelWithDebInfo --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Post failure tail to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            TAIL=$(tail -n 80 "$GITHUB_WORKSPACE/build.log")
          else
            TAIL="build.log not created"
          fi
          jq -n --arg body "\`\`\`\n$TAIL\n\`\`\`" '{body: $body}' | \
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d @- \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"

      - name: Upload APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: powervr-pixel10-latest
          name: Eden PowerVR Pixel 10 Test Build
          prerelease: true
          make_latest: false
          files: src/android/app/build/outputs/apk/mainline/relWithDebInfo/*.apk
