name: Android Build (PowerVR Pixel 10)

on:
  push:
    branches:
      - powervr-pixel10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK, NDK, and CMake
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache glslang-tools nasm pkg-config
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;3.31.6"

      - name: Cache Gradle and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/ccache
            .cache/cpm
          key: gradle-ccache-${{ runner.os }}-${{ hashFiles('src/android/**/*.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/ccache
          ccache --set-config=max_size=4G
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Bundle Khronos Vulkan Validation Layer (arm64-v8a)
        run: |
          mkdir -p src/android/app/src/main/jniLibs/arm64-v8a
          curl -sSL "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-1.4.363.1/android-binaries-1.4.363.1.tar.gz" -o vvl.tar.gz
          tar -xzf vvl.tar.gz
          VVL_SO=$(find . -name "libVkLayer_khronos_validation.so" | grep "arm64-v8a" | head -n 1)
          cp "$VVL_SO" src/android/app/src/main/jniLibs/arm64-v8a/
          rm -rf vvl.tar.gz android-binaries-*

      - name: Build Android APK (mainlineRelWithDebInfo)
        working-directory: src/android
        run: |
          chmod +x gradlew
          set -o pipefail
          (
            ./gradlew externalNativeBuildMainlineRelWithDebInfo --no-daemon &&
            ./gradlew assembleMainlineRelWithDebInfo --no-daemon
          ) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Post failure tail to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            ERRS=$(grep -n -C 3 -E "CMake Error|fatal error:|error:|FAILED:|Caused by:" "$GITHUB_WORKSPACE/build.log" | tail -n 80 || true)
            TAIL=$(tail -n 30 "$GITHUB_WORKSPACE/build.log")
            OUT="${ERRS}\n---\n${TAIL}"
          else
            OUT="build.log not created"
          fi
          jq -n --arg body "\`\`\`\n$OUT\n\`\`\`" '{body: $body}' | \
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d @- \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"

      - name: Upload APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: powervr-pixel10-latest
          name: Eden PowerVR Pixel 10 Test Build
          prerelease: true
          make_latest: false
          files: src/android/app/build/outputs/apk/mainline/relWithDebInfo/*.apk
