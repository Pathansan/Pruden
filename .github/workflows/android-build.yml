name: Android Build (PowerVR Pixel 10)

on:
  push:
    branches:
      - powervr-pixel10
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK, NDK, and CMake
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;3.31.5"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Android APK (mainlineRelWithDebInfo)
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineRelWithDebInfo --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eden-powervr-pixel10-apk
          path: src/android/app/build/outputs/apk/mainline/relWithDebInfo/*.apk
